services:
  photo-album:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 留空则前端用相对路径 /api（同源访问）。如需跨域访问反向代理才需改成绝对地址。
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: photo-album:latest
    container_name: photo-album-server
    ports:
      - "${PORT:-80}:${PORT:-80}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-80}
      # 必须显式设置，避免使用弱默认值（backend 侧未设置时启动也会失败）
      - JWT_SECRET=${JWT_SECRET:?请在 .env 中设置 JWT_SECRET（可用 openssl rand -hex 32 生成）}
      - UPLOAD_DIR=/app/uploads
      - DATABASE_PATH=/app/data/photo-album.sqlite
    volumes:
      # 数据持久化到宿主机当前目录（README「数据持久化」一节与此对应）
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+process.env.PORT+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
