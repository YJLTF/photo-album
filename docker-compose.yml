services:
  photo-album:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 留空则前端用相对路径 /api（同源访问）。如需跨域访问反向代理才需改成绝对地址。
        VITE_API_URL: ${VITE_API_URL:-/api}
    image: photo-album:latest
    container_name: photo-album-server
    ports:
      - "${PORT:-80}:${PORT:-80}"
    environment:
      - NODE_ENV=production
      - PORT=${PORT:-80}
      - JWT_SECRET=${JWT_SECRET:-JWT_SECRET}
      - UPLOAD_DIR=/app/uploads
      - DATABASE_PATH=/app/data/photo-album.sqlite
    volumes:
      - /app/photo-album/data:/app/data
      - /app/photo-album/uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:'+process.env.PORT+'/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
